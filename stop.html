<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="stop.css">
</head>
<body>
    <div class="stopwatch">
        <div class="timerDisplay">00 : 00 : 00</div>
    </div>
    <div class="buttons">
        <button id="start" class="btn" style="background-color: green">Start</button>
        <button id="stop" class="btn" style="background-color: red;">Stop</button>
        <button id="reset" class="btn" style="background-color: blue;">Reset</button>
    </div>
    <script src="stop.js"></script>
</body>
</html>
